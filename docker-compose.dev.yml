services:
  db:
    ports:
      - '${DB_PORT:-5432}:5432'

  server:
    ports:
      - '${SERVER_PORT:-5000}:5000'

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - '${CLIENT_DEBUG_PORT:-5173}:5173'
    volumes:
      - ./client/src:/app/src
      - ./client/index.html:/app/index.html
      - ./client/public:/app/public
      - ./client/vite.config.js:/app/vite.config.js
    environment:
      VITE_API_URL: /api
      VITE_API_PROXY_TARGET: 'http://server:${SERVER_PORT:-5000}'
